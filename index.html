<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daily Habit Tracker</title>
  <style>
    /* 1. CSS Custom Properties (Theme Variables) */
    :root {
      --bg-color: #f1f5f9;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
      --item-bg: #ffffff;
      --item-hover: #f8fafc;
      --progress-bg: #f8fafc;
      --input-border: #cbd5e1;
      --tab-btn-bg: #f1f5f9;
      --tab-btn-text: #64748b;
      --active-tab-bg: #0f172a;
      --active-tab-text: #ffffff;
      --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.03);
    }

    [data-theme="dark"] {
      --bg-color: #0b1120;
      --card-bg: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: #334155;
      --item-bg: #1e293b;
      --item-hover: #26334d;
      --progress-bg: #0f172a;
      --input-border: #475569;
      --tab-btn-bg: #0f172a;
      --tab-btn-text: #94a3b8;
      --active-tab-bg: #38bdf8;
      --active-tab-text: #0f172a;
      --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.35);
    }

    /* 2. Base Styles & Typography */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 1.5rem 1rem;
      position: relative;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    /* Confetti canvas overlay */
    #confetti-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 100;
    }

    /* 3. Main App Card */
    .app-card {
      background: var(--card-bg);
      width: 100%;
      max-width: 520px;
      border-radius: 20px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border-color);
      padding: 1.75rem;
      position: relative;
      z-index: 1;
      transition: background-color 0.3s ease, border-color 0.3s ease;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.25rem;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .subtitle {
      font-size: 0.875rem;
      color: var(--text-muted);
      margin-top: 0.25rem;
    }

    /* Theme Toggle Button */
    .btn-theme {
      background: var(--tab-btn-bg);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      font-size: 1.1rem;
      width: 2.5rem;
      height: 2.5rem;
      border-radius: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
    }

    .btn-theme:hover {
      transform: scale(1.05);
    }

    /* 4. Celebration Banner */
    .celebration-banner {
      display: none;
      background: linear-gradient(135deg, #fef08a 0%, #fed7aa 100%);
      border: 1px solid #fde047;
      border-radius: 12px;
      padding: 0.875rem 1rem;
      margin-bottom: 1.25rem;
      text-align: center;
      animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .celebration-banner.show {
      display: block;
    }

    .celebration-title {
      font-size: 0.95rem;
      font-weight: 700;
      color: #854d0e;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.35rem;
    }

    .celebration-sub {
      font-size: 0.8rem;
      color: #a16207;
      margin-top: 0.25rem;
    }

    @keyframes popIn {
      0% { transform: scale(0.9); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    /* 5. Progress Bar */
    .progress-section {
      background: var(--progress-bg);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      padding: 0.875rem 1rem;
      margin-bottom: 1.25rem;
    }

    .progress-text {
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 0.5rem;
    }

    .progress-bar-bg {
      background: var(--border-color);
      height: 8px;
      border-radius: 999px;
      overflow: hidden;
    }

    .progress-bar-fill {
      background: #3b82f6;
      height: 100%;
      width: 0%;
      border-radius: 999px;
      transition: width 0.3s ease, background-color 0.3s ease;
    }

    .progress-bar-fill.complete {
      background: #10b981;
    }

    /* 6. Add Habit Form */
    .add-habit-form {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1.25rem;
      flex-wrap: wrap;
    }

    .habit-input {
      flex: 1 1 200px;
      padding: 0.65rem 0.85rem;
      border: 1px solid var(--input-border);
      background: var(--card-bg);
      color: var(--text-main);
      border-radius: 10px;
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .habit-input:focus {
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
    }

    .category-select {
      padding: 0.65rem 0.75rem;
      border: 1px solid var(--input-border);
      border-radius: 10px;
      font-size: 0.85rem;
      background: var(--card-bg);
      color: var(--text-main);
      cursor: pointer;
      outline: none;
    }

    .btn-add {
      background: #3b82f6;
      color: #ffffff;
      border: none;
      padding: 0.65rem 1rem;
      border-radius: 10px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s ease;
      white-space: nowrap;
    }

    .btn-add:hover {
      background: #2563eb;
    }

    /* 7. Filter Tabs */
    .filter-tabs {
      display: flex;
      gap: 0.35rem;
      margin-bottom: 1rem;
      overflow-x: auto;
      padding-bottom: 0.25rem;
      scrollbar-width: none;
    }

    .filter-tabs::-webkit-scrollbar {
      display: none;
    }

    .filter-btn {
      background: var(--tab-btn-bg);
      border: 1px solid transparent;
      color: var(--tab-btn-text);
      padding: 0.35rem 0.75rem;
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s ease;
    }

    .filter-btn:hover {
      color: var(--text-main);
    }

    .filter-btn.active {
      background: var(--active-tab-bg);
      color: var(--active-tab-text);
    }

    /* 8. Habit Items List */
    .habit-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .habit-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.875rem 1rem;
      border-radius: 14px;
      border: 1px solid var(--border-color);
      background: var(--item-bg);
      transition: all 0.2s ease;
    }

    .habit-item:hover {
      background: var(--item-hover);
    }

    .habit-left {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      flex: 1;
      min-width: 0;
    }

    .habit-checkbox {
      width: 1.25rem;
      height: 1.25rem;
      accent-color: #10b981;
      cursor: pointer;
      flex-shrink: 0;
    }

    .habit-details {
      display: flex;
      flex-direction: column;
      gap: 0.2rem;
      min-width: 0;
    }

    .habit-title {
      font-size: 0.95rem;
      font-weight: 500;
      color: var(--text-main);
      cursor: pointer;
      user-select: none;
      word-break: break-word;
    }

    /* Category Pill */
    .category-pill {
      display: inline-flex;
      align-items: center;
      font-size: 0.7rem;
      font-weight: 600;
      padding: 0.15rem 0.45rem;
      border-radius: 999px;
      width: fit-content;
    }

    .cat-health { background: #dcfce7; color: #15803d; }
    .cat-focus { background: #e0e7ff; color: #4338ca; }
    .cat-fitness { background: #ffedd5; color: #c2410c; }
    .cat-mind { background: #f3e8ff; color: #7e22ce; }
    .cat-general { background: var(--tab-btn-bg); color: var(--text-muted); }

    /* Completed state */
    .habit-item.completed {
      background: rgba(16, 185, 129, 0.08);
      border-color: rgba(16, 185, 129, 0.3);
    }

    .habit-item.completed .habit-title {
      text-decoration: line-through;
      color: #10b981;
    }

    .habit-right {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-left: 0.75rem;
      flex-shrink: 0;
    }

    /* 9. Streak Badges & Delete Button */
    .streak-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.25rem;
      background: #fff7ed;
      color: #ea580c;
      border: 1px solid #ffedd5;
      font-size: 0.8rem;
      font-weight: 600;
      padding: 0.25rem 0.5rem;
      border-radius: 999px;
      white-space: nowrap;
    }

    [data-theme="dark"] .streak-badge {
      background: #431407;
      color: #fb923c;
      border-color: #7c2d12;
    }

    .habit-item.completed .streak-badge {
      background: #ffedd5;
      border-color: #fed7aa;
      color: #c2410c;
    }

    [data-theme="dark"] .habit-item.completed .streak-badge {
      background: #7c2d12;
      border-color: #9a3412;
      color: #fed7aa;
    }

    .btn-delete {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 1.2rem;
      cursor: pointer;
      padding: 0.2rem 0.4rem;
      border-radius: 6px;
      line-height: 1;
      transition: color 0.2s ease, background-color 0.2s ease;
    }

    .btn-delete:hover {
      color: #ef4444;
      background-color: rgba(239, 68, 68, 0.15);
    }

    /* 10. Card Footer */
    .card-footer {
      margin-top: 1.5rem;
      padding-top: 1rem;
      border-top: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    .footer-note {
      font-size: 0.78rem;
      color: var(--text-muted);
    }

    .btn-new-day {
      background: var(--tab-btn-bg);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      font-size: 0.82rem;
      font-weight: 600;
      padding: 0.45rem 0.85rem;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
    }

    .btn-new-day:hover {
      background: var(--border-color);
    }

    /* Toast notification */
    .toast {
      position: fixed;
      bottom: 1.5rem;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: #1e293b;
      color: #ffffff;
      padding: 0.65rem 1.25rem;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 500;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.2);
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      z-index: 101;
      pointer-events: none;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
    }

    .empty-state {
      text-align: center;
      padding: 2rem 1rem;
      color: var(--text-muted);
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

  <!-- Confetti Canvas -->
  <canvas id="confetti-canvas"></canvas>

  <!-- Main Card -->
  <main class="app-card">
    <header>
      <div>
        <h1>🌱 Daily Habit Tracker</h1>
        <p class="subtitle" id="current-date">Today's Goals</p>
      </div>
      <button class="btn-theme" id="btn-theme" title="Toggle Dark/Light Mode" aria-label="Toggle Theme">
        🌙
      </button>
    </header>

    <!-- Celebration Banner -->
    <div class="celebration-banner" id="celebration-banner">
      <div class="celebration-title">🎉 All Habits Completed!</div>
      <p class="celebration-sub">Incredible consistency today. Your streaks are shining bright! 🌟</p>
    </div>

    <!-- Progress Overview -->
    <section class="progress-section" aria-label="Daily Progress">
      <div class="progress-text">
        <span>Daily Progress</span>
        <span id="progress-status">0 of 0 completed</span>
      </div>
      <div class="progress-bar-bg">
        <div class="progress-bar-fill" id="progress-fill"></div>
      </div>
    </section>

    <!-- Add Habit Form -->
    <form class="add-habit-form" id="add-habit-form">
      <input 
        type="text" 
        id="habit-input" 
        class="habit-input" 
        placeholder="Add a new habit..." 
        required
        autocomplete="off"
      >
      <select id="habit-category" class="category-select" aria-label="Select category">
        <option value="health">🍏 Health</option>
        <option value="focus">📚 Focus</option>
        <option value="fitness">🏃 Fitness</option>
        <option value="mind">🧘 Mind</option>
      </select>
      <button type="submit" class="btn-add">Add Habit</button>
    </form>

    <!-- Category Filter Tabs -->
    <div class="filter-tabs" id="filter-tabs" role="tablist">
      <button class="filter-btn active" data-filter="all">All</button>
      <button class="filter-btn" data-filter="health">🍏 Health</button>
      <button class="filter-btn" data-filter="focus">📚 Focus</button>
      <button class="filter-btn" data-filter="fitness">🏃 Fitness</button>
      <button class="filter-btn" data-filter="mind">🧘 Mind</button>
    </div>

    <!-- Habit List -->
    <ul class="habit-list" id="habit-list"></ul>

    <!-- Footer Controls -->
    <footer class="card-footer">
      <span class="footer-note">Streaks update on new days</span>
      <button class="btn-new-day" id="btn-new-day" title="Advance to a new day and lock in completed streaks">
        ☀️ Start New Day
      </button>
    </footer>
  </main>

  <!-- In-page Toast Notification -->
  <div class="toast" id="toast">New day started! 🌅</div>

  <script>
    // 1. Format today's date in header
    const dateElement = document.getElementById("current-date");
    const today = new Date();
    dateElement.textContent = today.toLocaleDateString("en-US", {
      weekday: "long",
      month: "short",
      day: "numeric"
    });

    // 2. DOM elements
    const habitList = document.getElementById("habit-list");
    const progressStatus = document.getElementById("progress-status");
    const progressFill = document.getElementById("progress-fill");
    const addHabitForm = document.getElementById("add-habit-form");
    const habitInput = document.getElementById("habit-input");
    const habitCategory = document.getElementById("habit-category");
    const celebrationBanner = document.getElementById("celebration-banner");
    const btnNewDay = document.getElementById("btn-new-day");
    const toast = document.getElementById("toast");
    const filterTabs = document.getElementById("filter-tabs");
    const btnTheme = document.getElementById("btn-theme");

    // 3. Storage keys & default data
    const STORAGE_KEY = "daily_habit_tracker_items";
    const THEME_KEY = "daily_habit_tracker_theme";

    const DEFAULT_HABITS = [
      { id: "1", title: "💧 Drink 2L water", category: "health", streak: 3, completed: false },
      { id: "2", title: "📖 Read 15 minutes", category: "focus", streak: 5, completed: false },
      { id: "3", title: "🏃 20-min walk / workout", category: "fitness", streak: 1, completed: false }
    ];

    const CATEGORY_NAMES = {
      health: { label: "🍏 Health", class: "cat-health" },
      focus: { label: "📚 Focus", class: "cat-focus" },
      fitness: { label: "🏃 Fitness", class: "cat-fitness" },
      mind: { label: "🧘 Mind", class: "cat-mind" }
    };

    let habits = loadHabits();
    let currentFilter = "all";
    let confettiActive = false;

    // 4. Dark Mode / Theme Logic
    function applyTheme(theme) {
      document.documentElement.setAttribute("data-theme", theme);
      btnTheme.textContent = theme === "dark" ? "☀️" : "🌙";
      try {
        localStorage.setItem(THEME_KEY, theme);
      } catch (e) {
        console.warn("Could not save theme preference:", e);
      }
    }

    function initTheme() {
      let savedTheme = "light";
      try {
        savedTheme = localStorage.getItem(THEME_KEY) || "light";
      } catch (e) {}
      applyTheme(savedTheme);
    }

    btnTheme.addEventListener("click", () => {
      const current = document.documentElement.getAttribute("data-theme") || "light";
      const nextTheme = current === "light" ? "dark" : "light";
      applyTheme(nextTheme);
    });

    initTheme();

    // 5. Web Audio API Chime (Synthesized in Code)
    let audioCtx = null;

    function playChime(isAllComplete = false) {
      try {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === "suspended") {
          audioCtx.resume();
        }

        const now = audioCtx.currentTime;
        // Two-tone bell for individual check, 4-note victory chord for 100%
        const notes = isAllComplete 
          ? [523.25, 659.25, 783.99, 1046.50] // C5, E5, G5, C6
          : [587.33, 880.00];                // D5, A5

        notes.forEach((freq, idx) => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();

          osc.type = "sine";
          osc.frequency.setValueAtTime(freq, now + idx * 0.08);

          // Smooth envelope: quick fade-in, gradual decay
          gain.gain.setValueAtTime(0, now + idx * 0.08);
          gain.gain.linearRampToValueAtTime(0.15, now + idx * 0.08 + 0.02);
          gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.08 + 0.4);

          osc.connect(gain);
          gain.connect(audioCtx.destination);

          osc.start(now + idx * 0.08);
          osc.stop(now + idx * 0.08 + 0.45);
        });
      } catch (e) {
        console.warn("Audio unavailable:", e);
      }
    }

    // 6. Safe HTML escape helper
    function escapeHTML(str) {
      return str.replace(/[&<>'"]/g, 
        tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
      );
    }

    // 7. Load habits
    function loadHabits() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          if (Array.isArray(parsed) && parsed.length > 0) {
            return parsed.map(h => ({
              ...h,
              category: h.category || "health"
            }));
          }
        }
      } catch (err) {
        console.warn("Storage restricted, using memory defaults.", err);
      }
      return [...DEFAULT_HABITS];
    }

    // 8. Save habits
    function saveHabits() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(habits));
      } catch (err) {
        console.warn("Could not save to localStorage:", err);
      }
    }

    // 9. Toast notification helper
    function showToast(message) {
      toast.textContent = message;
      toast.classList.add("show");
      setTimeout(() => {
        toast.classList.remove("show");
      }, 2500);
    }

    // 10. Lightweight Canvas Confetti
    const canvas = document.getElementById("confetti-canvas");
    const ctx = canvas.getContext("2d");
    let particles = [];

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener("resize", resizeCanvas);
    resizeCanvas();

    function triggerConfetti() {
      particles = [];
      const colors = ["#f59e0b", "#ef4444", "#3b82f6", "#10b981", "#8b5cf6", "#ec4899"]
      for (let i = 0; i < 70; i++) {
        particles.push({
          x: canvas.width / 2 + (Math.random() - 0.5) * 200,
          y: canvas.height * 0.35,
          vx: (Math.random() - 0.5) * 8,
          vy: Math.random() * -8 - 4,
          size: Math.random() * 8 + 4,
          color: colors[Math.floor(Math.random() * colors.length)],
          rotation: Math.random() * 360,
          rotationSpeed: (Math.random() - 0.5) * 10,
          gravity: 0.3,
          drag: 0.98,
          opacity: 1
        });
      }
      if (!confettiActive) {
        confettiActive = true;
        animateConfetti();
      }
    }

    function animateConfetti() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      let aliveCount = 0;

      particles.forEach((p) => {
        p.vy += p.gravity;
        p.vx *= p.drag;
        p.vy *= p.drag;
        p.x += p.vx;
        p.y += p.vy;
        p.rotation += p.rotationSpeed;
        p.opacity -= 0.008;

        if (p.opacity > 0 && p.y < canvas.height + 50) {
          aliveCount++;
          ctx.save();
          ctx.translate(p.x, p.y);
          ctx.rotate((p.rotation * Math.PI) / 180);
          ctx.globalAlpha = Math.max(0, p.opacity);
          ctx.fillStyle = p.color;
          ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.6);
          ctx.restore();
        }
      });

      if (aliveCount > 0) {
        requestAnimationFrame(animateConfetti);
      } else {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        confettiActive = false;
      }
    }

    // 11. Update progress
    function updateProgress() {
      const total = habits.length;
      const completedCount = habits.filter(h => h.completed).length;

      progressStatus.textContent = `${completedCount} of ${total} completed`;
      const percentage = total > 0 ? (completedCount / total) * 100 : 0;
      progressFill.style.width = `${percentage}%`;

      if (total > 0 && completedCount === total) {
        progressFill.classList.add("complete");
        celebrationBanner.classList.add("show");
      } else {
        progressFill.classList.remove("complete");
        celebrationBanner.classList.remove("show");
      }
    }

    // 12. Filter Tabs
    filterTabs.addEventListener("click", (e) => {
      const btn = e.target.closest(".filter-btn");
      if (!btn) return;

      filterTabs.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      currentFilter = btn.getAttribute("data-filter");
      renderHabits();
    });

    // 13. Render habit list
    function renderHabits() {
      habitList.innerHTML = "";

      const visibleHabits = habits.filter(h => {
        if (currentFilter === "all") return true;
        return h.category === currentFilter;
      });

      if (visibleHabits.length === 0) {
        const filterName = currentFilter === "all" ? "" : ` in ${currentFilter}`;
        habitList.innerHTML = `
          <li class="empty-state">
            No habits found${filterName}! Add one above to get started.
          </li>
        `;
        updateProgress();
        return;
      }

      visibleHabits.forEach((habit) => {
        const li = document.createElement("li");
        li.className = `habit-item ${habit.completed ? "completed" : ""}`;

        const displayStreak = habit.completed ? habit.streak + 1 : habit.streak;
        const dayLabel = displayStreak === 1 ? "day" : "days";
        const catInfo = CATEGORY_NAMES[habit.category] || { label: habit.category, class: "cat-general" };

        li.innerHTML = `
          <label class="habit-left">
            <input type="checkbox" class="habit-checkbox" ${habit.completed ? "checked" : ""}>
            <div class="habit-details">
              <span class="habit-title">${escapeHTML(habit.title)}</span>
              <span class="category-pill ${catInfo.class}">${catInfo.label}</span>
            </div>
          </label>
          <div class="habit-right">
            <span class="streak-badge">
              🔥 <span class="streak-count">${displayStreak}</span> ${dayLabel}
            </span>
            <button class="btn-delete" title="Delete habit" aria-label="Delete habit">×</button>
          </div>
        `;

        // Checkbox toggle & sound chime
        const checkbox = li.querySelector(".habit-checkbox");
        checkbox.addEventListener("change", () => {
          const wasAllComplete = habits.length > 0 && habits.every(h => h.completed);
          habit.completed = checkbox.checked;
          const isNowAllComplete = habits.length > 0 && habits.every(h => h.completed);

          if (habit.completed) {
            playChime(isNowAllComplete);
          }

          saveHabits();
          renderHabits();

          if (!wasAllComplete && isNowAllComplete) {
            triggerConfetti();
          }
        });

        // Delete button
        const deleteBtn = li.querySelector(".btn-delete");
        deleteBtn.addEventListener("click", () => {
          habits = habits.filter(h => h.id !== habit.id);
          saveHabits();
          renderHabits();
        });

        habitList.appendChild(li);
      });

      updateProgress();
    }

    // 14. Add new habit
    addHabitForm.addEventListener("submit", (e) => {
      e.preventDefault();
      const title = habitInput.value.trim();
      const category = habitCategory.value;
      if (!title) return;

      const newHabit = {
        id: Date.now().toString(),
        title: title,
        category: category,
        streak: 0,
        completed: false
      };

      habits.push(newHabit);
      saveHabits();
      renderHabits();

      habitInput.value = "";
      habitInput.focus();
    });

    // 15. "Start New Day" rollover
    btnNewDay.addEventListener("click", () => {
      if (habits.length === 0) {
        showToast("Add some habits first! 🌱");
        return;
      }

      habits.forEach((h) => {
        if (h.completed) {
          h.streak += 1;
        } else {
          h.streak = 0;
        }
        h.completed = false;
      });

      saveHabits();
      renderHabits();
      showToast("☀️ New day started! Streaks updated.");
    });

    // Initial render
    renderHabits();
  </script>
</body>
</html>
